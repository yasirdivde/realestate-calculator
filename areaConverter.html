<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area Converter – Real Estate Calculator</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Roboto font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .gov-header {
            background-color: #003366;
            color: #ffffff;
            padding: 0.75rem 1.5rem;
            border-bottom: 3px solid #d32f2f;
        }
        .gov-header h1 {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 0.2px;
            margin: 0;
        }
        .gov-container {
            max-width: 600px;
            margin: 1.5rem auto;
            padding: 0 1rem;
            flex: 1;
            width: 100%;
        }
        .back-link-bar {
            margin-bottom: 0.75rem;
        }
        .back-link-bar a {
            color: #003366;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 0.75rem;
            border: 1px solid #cfd8dc;
            border-radius: 4px;
            background-color: #ffffff;
            transition: background-color 0.2s;
        }
        .back-link-bar a:hover {
            background-color: #f0f4f8;
        }
        .gov-card {
            background: #ffffff;
            border: 1px solid #cfd8dc;
            border-radius: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            padding: 1.5rem;
        }
        .tab-bar {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.25rem;
            border-bottom: 2px solid #e5e7eb;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .tab-bar::-webkit-scrollbar {
            display: none;
        }
        .tab-btn {
            flex: 1 0 auto;
            min-width: 110px;
            white-space: nowrap;
            background: none;
            border: none;
            padding: 0.6rem 0.5rem;
            font-family: 'Roboto', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            color: #4b5563;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
            margin-bottom: -2px;
            text-align: center;
        }
        .tab-btn:hover {
            color: #003366;
        }
        .tab-btn.active {
            color: #003366;
            font-weight: 700;
            border-bottom-color: #d32f2f;
        }
        /* Mobile adjustments for tabs */
        @media (max-width: 480px) {
            .tab-btn {
                font-size: 0.8rem;
                padding: 0.5rem 0.25rem;
                min-width: 90px;
                border-bottom: 4px solid transparent;
            }
            .tab-bar {
                gap: 0.25rem;
            }
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: #1f2937;
            margin-bottom: 0.3rem;
        }
        .input-wrapper {
            position: relative;
        }
        .input-prefix {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .form-input {
            width: 100%;
            padding: 0.6rem 2.5rem 0.6rem 2.2rem;
            border: 1px solid #cfd8dc;
            border-radius: 4px;
            font-size: 0.95rem;
            color: #1f2937;
            background-color: #fafbfc;
            transition: border-color 0.2s, background-color 0.2s;
            font-family: 'Roboto', sans-serif;
        }
        .form-input:focus {
            outline: none;
            border-color: #003366;
            background-color: #ffffff;
            box-shadow: 0 0 0 2px rgba(0,51,102,0.08);
        }
        .copy-btn {
            position: absolute;
            right: 0.5rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #6b7280;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 0.2rem;
            transition: color 0.2s;
        }
        .copy-btn:hover {
            color: #003366;
        }
        .conversion-info {
            font-size: 0.8rem;
            color: #6b7280;
            margin-top: 0.75rem;
            text-align: center;
        }
        .gov-footer {
            text-align: center;
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
            color: #6b7280;
            margin-top: auto;
            border-top: 1px solid #e5e7eb;
        }
        .gov-footer a {
            color: #003366;
            text-decoration: none;
            font-weight: 500;
        }
        .gov-footer a:hover { text-decoration: underline; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <header class="gov-header">
        <h1><i class="fa-solid fa-ruler-combined mr-2"></i>Area Converter</h1>
    </header>

    <main class="gov-container">
        <!-- Back link -->
        <div class="back-link-bar">
            <a href="./index.html">
                <i class="fa-solid fa-arrow-left"></i> Back
            </a>
        </div>

        <div class="gov-card">
            <!-- Tabs -->
            <div class="tab-bar">
                <button class="tab-btn active" id="tab1Btn" onclick="switchTab(1)">
                    ft² <i class="fa-solid fa-arrows-left-right mr-1"></i>m²
                </button>
                <button class="tab-btn" id="tab2Btn" onclick="switchTab(2)">
                    Carpet <i class="fa-solid fa-arrows-left-right mr-1"></i>Built-up
                </button>
            </div>

            <!-- Tab 1: Square Foot <-> Square Metre -->
            <div id="tab1Content">
                <div class="form-group">
                    <label class="form-label" for="sqftInput">Square Feet</label>
                    <div class="input-wrapper">
                        <span class="input-prefix">ft²</span>
                        <input type="number" id="sqftInput" class="form-input" placeholder="Enter square feet" min="0" step="any" oninput="convertFromSqft()">
                        <button class="copy-btn" onclick="copyValue('sqftInput')" title="Copy">
                            <i class="fa-regular fa-copy"></i>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="sqmInput">Square Metre</label>
                    <div class="input-wrapper">
                        <span class="input-prefix">m²</span>
                        <input type="number" id="sqmInput" class="form-input" placeholder="Enter square metre" min="0" step="any" oninput="convertFromSqm()">
                        <button class="copy-btn" onclick="copyValue('sqmInput')" title="Copy">
                            <i class="fa-regular fa-copy"></i>
                        </button>
                    </div>
                </div>
                <div class="conversion-info">
                    1 m² = 10.7639 ft²
                </div>
            </div>

            <!-- Tab 2: Carpet Area <-> Built-up Area -->
            <div id="tab2Content" class="hidden">
                <div class="form-group">
                    <label class="form-label" for="carpetInput">Carpet Area</label>
                    <div class="input-wrapper">
                        <span class="input-prefix">C</span>
                        <input type="number" id="carpetInput" class="form-input" placeholder="Enter carpet area" min="0" step="any" oninput="convertFromCarpet()">
                        <button class="copy-btn" onclick="copyValue('carpetInput')" title="Copy">
                            <i class="fa-regular fa-copy"></i>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="builtupInput">Built-up Area</label>
                    <div class="input-wrapper">
                        <span class="input-prefix">B</span>
                        <input type="number" id="builtupInput" class="form-input" placeholder="Enter built-up area" min="0" step="any" oninput="convertFromBuiltup()">
                        <button class="copy-btn" onclick="copyValue('builtupInput')" title="Copy">
                            <i class="fa-regular fa-copy"></i>
                        </button>
                    </div>
                </div>
                <div class="conversion-info">
                    Built-up Area = Carpet Area + 20%
                </div>
            </div>
        </div>
    </main>

    <footer class="gov-footer">
        <i class="fa-solid fa-code mr-1"></i> Developed by <a href="https://github.com/yasirdivde" target="_blank">Yasir Divde</a>
    </footer>

    <script>
        // Tab switching
        function switchTab(tabNumber) {
            const tab1 = document.getElementById('tab1Content');
            const tab2 = document.getElementById('tab2Content');
            const btn1 = document.getElementById('tab1Btn');
            const btn2 = document.getElementById('tab2Btn');

            if (tabNumber === 1) {
                tab1.classList.remove('hidden');
                tab2.classList.add('hidden');
                btn1.classList.add('active');
                btn2.classList.remove('active');
            } else {
                tab1.classList.add('hidden');
                tab2.classList.remove('hidden');
                btn1.classList.remove('active');
                btn2.classList.add('active');
            }
        }

        // Copy value to clipboard
        function copyValue(inputId) {
            const input = document.getElementById(inputId);
            if (input && input.value) {
                navigator.clipboard.writeText(input.value).then(() => {
                    const btn = document.querySelector(`button[onclick="copyValue('${inputId}')"] i`);
                    if (btn) {
                        const originalClass = btn.className;
                        btn.className = 'fa-solid fa-check';
                        setTimeout(() => {
                            btn.className = originalClass;
                        }, 800);
                    }
                }).catch(err => {
                    console.error('Copy failed:', err);
                });
            }
        }

        // Square Foot <-> Square Metre conversions
        const SQFT_PER_SQM = 10.7639;

        function convertFromSqft() {
            const sqft = parseFloat(document.getElementById('sqftInput').value);
            if (!isNaN(sqft) && sqft >= 0) {
                const sqm = sqft / SQFT_PER_SQM;
                document.getElementById('sqmInput').value = sqm.toFixed(4);
            } else {
                document.getElementById('sqmInput').value = '';
            }
        }

        function convertFromSqm() {
            const sqm = parseFloat(document.getElementById('sqmInput').value);
            if (!isNaN(sqm) && sqm >= 0) {
                const sqft = sqm * SQFT_PER_SQM;
                document.getElementById('sqftInput').value = sqft.toFixed(4);
            } else {
                document.getElementById('sqftInput').value = '';
            }
        }

        // Carpet Area <-> Built-up Area conversions (in m²)
        const BUILTUP_FACTOR = 1.2; // +20%

        function convertFromCarpet() {
            const carpet = parseFloat(document.getElementById('carpetInput').value);
            if (!isNaN(carpet) && carpet >= 0) {
                const builtup = carpet * BUILTUP_FACTOR;
                document.getElementById('builtupInput').value = builtup.toFixed(4);
            } else {
                document.getElementById('builtupInput').value = '';
            }
        }

        function convertFromBuiltup() {
            const builtup = parseFloat(document.getElementById('builtupInput').value);
            if (!isNaN(builtup) && builtup >= 0) {
                const carpet = builtup / BUILTUP_FACTOR;
                document.getElementById('carpetInput').value = carpet.toFixed(4);
            } else {
                document.getElementById('carpetInput').value = '';
            }
        }

        // Initialize: clear any values if reloaded
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('sqftInput').value = '';
            document.getElementById('sqmInput').value = '';
            document.getElementById('carpetInput').value = '';
            document.getElementById('builtupInput').value = '';
        });
    </script>
</body>
</html>
